<script>
document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const f=document.querySelector('#form'),d=f&&f.contentDocument,w=f&&f.contentWindow;if(!d||!w)return;const note=d.querySelector('.voice-note');let recognition,currentButton;const say=t=>{if(note)note.textContent=t};d.querySelectorAll('button.mic').forEach(button=>{const field=button.previousElementSibling;if(!field)return;button.onclick=()=>{const Recognition=w.SpeechRecognition||w.webkitSpeechRecognition;if(!Recognition){say('دیکتهٔ صوتی در این مرورگر پشتیبانی نمی‌شود؛ از Google Chrome استفاده کنید.');return}if(currentButton===button&&recognition){recognition.stop();return}if(recognition)recognition.stop();recognition=new Recognition();currentButton=button;recognition.lang='fa-IR';recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{button.classList.add('listening');say('در حال شنیدن… صحبت کنید.');};recognition.onresult=e=>{const finalText=[];for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)finalText.push(e.results[i][0].transcript.trim());const text=finalText.join(' ').trim();if(text){field.value+=(field.value?' ':'')+text;field.dispatchEvent(new Event('input',{bubbles:true}));}};recognition.onerror=e=>say('دیکته انجام نشد: '+e.error);recognition.onend=()=>{button.classList.remove('listening');currentButton=null;say('دیکته پایان یافت. متن فقط یک‌بار ثبت شد.');};recognition.start();};});},700);});

const frame=document.querySelector('#form');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow,form=d.querySelector('#intake'),css=d.createElement('style');css.textContent='.voice-note{font-size:.88rem;color:#637384;margin:0 0 12px}.mic{display:inline-flex;align-items:center;gap:6px;margin:7px 0 0;background:#fff;color:#155e75;border:1px solid #155e75;padding:6px 10px;font-size:.84rem}.mic.listening{background:#b91c1c;color:#fff;border-color:#b91c1c}.export-sheet{position:fixed;left:-20000px;top:0;width:800px;background:#fff;padding:36px;color:#17212b;direction:rtl;font-family:Tahoma,Arial,sans-serif}.export-sheet h1,.export-sheet b{color:#155e75}.export-sheet .item{margin:12px 0;padding:10px;background:#f1f7f9;border-radius:6px}';d.head.append(css);const note=d.createElement('p');note.className='voice-note';note.textContent='برای دیکته، روی میکروفون زیر کادر پاسخ موردنظر بزنید و اجازهٔ استفاده از میکروفون را بدهید.';form.prepend(note);let rec,active,activeBtn;const Recognition=w.SpeechRecognition||w.webkitSpeechRecognition,tell=t=>note.textContent=t,stop=()=>{if(rec)rec.stop();if(activeBtn)activeBtn.classList.remove('listening');activeBtn=null};form.querySelectorAll('textarea,input[type="text"]').forEach((field,i)=>{const b=d.createElement('button');b.type='button';b.className='mic';b.textContent='🎙 دیکتهٔ صوتی';b.setAttribute('aria-label','دیکتهٔ صوتی برای پرسش '+(i+1));b.onclick=()=>{if(activeBtn===b)return stop();if(!Recognition)return tell('دیکتهٔ صوتی در این مرورگر پشتیبانی نمی‌شود؛ از Google Chrome استفاده کنید.');stop();active=field;activeBtn=b;rec=new Recognition();rec.lang='fa-IR';rec.interimResults=true;rec.continuous=false;rec.onstart=()=>{b.classList.add('listening');tell('در حال شنیدن… صحبت کنید.');};rec.onresult=e=>{let text='';for(let n=e.resultIndex;n<e.results.length;n++)text+=e.results[n][0].transcript;active.value+=(active.value?' ':'')+text.trim();active.dispatchEvent(new Event('input',{bubbles:true}));};rec.onerror=e=>tell('دیکته انجام نشد: '+e.error);rec.onend=()=>{b.classList.remove('listening');activeBtn=null;tell('دیکته پایان یافت.');};rec.start();};field.insertAdjacentElement('afterend',b);});const panel=form.querySelector('.buttons'),button=(label,fn)=>{const b=d.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.onclick=fn;panel.insertBefore(b,panel.querySelector('#save'));},esc=x=>String(x||'—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'),sheet=()=>{let rows='';form.querySelectorAll('label').forEach(l=>{const c=l.querySelector('input,textarea');if(c)rows+='<div class="item"><b>'+esc(l.childNodes[0]?.textContent?.trim())+'</b><div>'+esc(c.value)+'</div></div>'});const x=d.createElement('article');x.className='export-sheet';x.innerHTML='<h1>پرسش‌نامه اولیه مشاور هوش مصنوعی</h1><p>تهیه‌کننده: دکتر فرشاد فتحی — فلوشیپ انفورماتیک بالینی</p><p>تاریخ خروجی: '+new Date().toLocaleDateString('fa-IR')+'</p><hr>'+rows;d.body.append(x);return x},download=(name,blob)=>{const a=d.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},load=src=>new Promise((ok,bad)=>{const s=d.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;d.head.append(s)}),libs=Promise.all([load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);button('دانلود Word',()=>{const x=sheet(),html='<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Tahoma;direction:rtl;line-height:1.9;padding:25px}.item{margin:12px 0;padding:10px;background:#f1f7f9}h1,b{color:#155e75}</style></head><body>'+x.innerHTML+'</body></html>';x.remove();download('پاسخ-پرسش‌نامه-مشاور-هوش-مصنوعی.doc',new Blob(['\ufeff',html],{type:'application/msword'}));});button('دانلود PDF',async()=>{tell('در حال ساخت فایل PDF…');const x=sheet();try{await libs;const canvas=await w.html2canvas(x,{scale:2,backgroundColor:'#fff'}),pdf=new w.jspdf.jsPDF('p','mm','a4'),width=190,height=canvas.height*width/canvas.width,image=canvas.toDataURL('image/png');let left=height,y=10;while(left>0){pdf.addImage(image,'PNG',10,y,width,height);left-=277;if(left>0){pdf.addPage();y-=277}}pdf.save('پاسخ-پرسش‌نامه-مشاور-هوش-مصنوعی.pdf');tell('فایل PDF آماده شد.')}catch(e){tell('ساخت PDF انجام نشد؛ اتصال اینترنت را بررسی کنید یا از چاپ مرورگر و Save as PDF استفاده کنید.')}finally{x.remove()}});});
